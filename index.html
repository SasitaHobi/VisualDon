<html>

<head>
  <meta charset="UTF-8">
  <script language="javascript" type="text/javascript" src="https://cdn.jsdelivr.net/npm/p5@1.0.0/lib/p5.min.js">
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200;300&display=swap" rel="stylesheet">

  <script src="./addons/dat.gui.js"></script>
  <style>
    body {
      background: rgba(255, 245, 245);
      animation: fadeInAnimation ease .5s;
      animation-iteration-count: 1;
      animation-fill-mode: forwards;
    }

    @keyframes fadeInAnimation {
      0% {
        opacity: 0;
      }

      100% {
        opacity: 1;
      }
    }

    button.refresh {
      display: block;
      color: red;
      font-family: 'Inconsolata', monospace;
      font-size: 16px;
      font-weight: 800;
      background: none;
      border: 1px solid red;
      padding: 8px;
      padding-left: 12px;
      padding-right: 12px;
    }

    .container {
      position: absolute;
      top: 10%;
      left: 10%;
    }

    canvas {
      width: 500px;
      display: flex;
      margin: 0 auto;
      margin-top: 12px;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 150px;
      background: rgba(255, 245, 245);
      border-top: 1px solid #ccc;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 10px;
      overflow-x: auto;
    }

    .flower-canvas {
      width: 80px;
      height: 80px;
      flex-shrink: 0;
    }
  </style>
</head>

<body style="display: block; justify-content: center; margin: 0 auto; padding-bottom: 200px;">
  <div class="container">
    <h2>VisualDon</h2>
    <!-- <button class="refresh" onClick="location.reload()">New Flower</button><br> -->
  </div>

  <footer id="flower-footer">
  </footer>

</body>
<script src="src/config.js"></script>
<script src="src/flower.js"></script>
<!-- <script src="src/footer-flowers.js"></script> -->
<script language="javascript" type="text/javascript" src="src/index.js"></script>

</html>
